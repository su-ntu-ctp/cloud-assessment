name: Pytest Suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - solution

jobs:
  run-pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests with pytest
        run: |
          pytest --junit-xml results.xml

      - name: Show test results
        if: ${{ always() }}
        uses: test-summary/action@v2
        with:
          paths: "results.xml"

      - name: Show test results
        if: ${{ always() }}
        uses: test-summary/action@v2
        with:
          paths: "results.xml"

      - name: Show test results
        if: always()
        uses: test-summary/action@v2
        with:
          paths: "results.xml"

      - name: Show test report
        if: always()
        uses: pmeier/pytest-results-action@main
        with:
          path: results.xmlyou
          summary: true
          display-options: fEX

